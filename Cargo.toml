[workspace]
resolver = "3"
members = ["crates/nucleo", "crates/replay", "crates/overlay"]

[workspace.package]
# SemVer. A release usa a versÃ£o da tag (v0.2.0 â†’ 0.2.0); manter igual Ã  tag ao lanÃ§ar.
version = "0.13.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
nucleo = { path = "crates/nucleo" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = "0.61"

# ExecutÃ¡vel pequeno: o tamanho Ã© o motivo da troca de C# para Rust.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
