# Tag v* (ex.: v0.3.0) → testes → Aion2Meter.exe → release com o zip.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # O rodapé do overlay mostra a versão do Cargo.toml, não a da tag.
      - name: Conferir versão
        shell: pwsh
        run: |
          $versao = '${{ github.ref_name }}'.TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($cargo -ne $versao) { throw "Tag v$versao, mas o Cargo.toml diz $cargo" }

      - name: Testes
        run: cargo test --workspace

      - name: Publicar
        shell: pwsh
        run: |
          $versao = '${{ github.ref_name }}'.TrimStart('v')
          cargo build --release -p overlay
          Compress-Archive -Path target/release/Aion2Meter.exe -DestinationPath "Aion2Meter-$versao-win-x64.zip"

      - name: Criar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versao = '${{ github.ref_name }}'.TrimStart('v')
          gh release create '${{ github.ref_name }}' "Aion2Meter-$versao-win-x64.zip" `
            --title "Aion2Meter ${{ github.ref_name }}" --notes-file .github/notas-da-release.md --generate-notes
